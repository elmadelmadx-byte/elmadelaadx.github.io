<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vibers V Global executive ecosystem and applicant management platform." />
    <title>Vibers V Global</title>
  </head>
  <body>
    <div id="root"></div>

    <a
      href="https://elmadelmadx-byte.github.io/"
      target="_blank"
      rel="noopener noreferrer"
      style="
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 9999;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
        color: #ffffff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3px;
        box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
        border: 1px solid rgba(255,255,255,0.2);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      "
      onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 16px 36px rgba(37, 99, 235, 0.42)';"
      onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 12px 30px rgba(37, 99, 235, 0.35)';"
    >
      موقعي الإلكتروني
    </a>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
